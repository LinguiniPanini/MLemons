[tool.black]
line-length = 100
target-version = ['py311']

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "invalid-name"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
